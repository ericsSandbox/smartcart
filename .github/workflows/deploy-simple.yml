name: Deploy to GitHub Pages (Simple - DISABLED)

# GitHub Pages is configured to deploy directly from the main branch root.
# No workflow needed - just push to main and the site updates automatically.
on:
  workflow_dispatch:
    inputs:
      disabled:
        description: 'Disabled - site auto-deploys from main branch'
        required: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create dist folder
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r public/* dist/ 2>/dev/null || true
          touch dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
